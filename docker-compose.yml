services:
  model:
    build:
      context: ./model
      dockerfile: ./Dockerfile
    depends_on:
      - cicflowmetter
    volumes:
      - ./cicflowmeter_output:/CICFlowMeter/data/daily
    environment:
      JAVA_GATEWAY_HOST: 127.0.0.1
    network_mode: host
    restart: always


  cicflowmetter:    
    build: 
      context: ./CICFlowMeter-master
      dockerfile: ./Dockerfile
    volumes:
      - ./cicflowmeter_output:/CICFlowMeter/data/daily
    environment:
      MODEL_HOST: 127.0.0.1
      CICFLOW_IFACE: lo
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    privileged: true
    restart: always